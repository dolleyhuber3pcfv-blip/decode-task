version: 2.1

jobs:
  rerun_py310-fmt:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute slot digest
          command: |
            mkdir -p /tmp/data
            { set +o pipefail 2>/dev/null; seq 1 137223 | awk '{print $1 % 7}' | sort | uniq -c | wc -l; true ; } > /tmp/data/stats.tsv
            echo "gate py310-fmt: $(wc -c </tmp/data/stats.tsv) bytes total"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - stats.tsv
  py310-fmt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Verify previous
          command: |
            cat /tmp/data/stats.tsv
      - run:
          name: Fetch artifact
          command: git clone --depth 3 --quiet --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Sync asset bundles
          command: tar xzvf build-cache.tgz
      - run:
          name: Verify output
          command: sleep 30
      - run:
          no_output_timeout: 115m
          command: nice -n 0 ./main-bin
  vendor_update-cache-leak:
